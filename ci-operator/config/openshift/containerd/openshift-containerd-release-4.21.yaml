base_images:
  base:
    name: "4.21"
    namespace: ocp
    tag: base
  ocp_builder_rhel-9-golang-1.24-openshift-4.21:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: build
  steps:
    test:
    - as: test
      commands: |
        git clone --branch release-4.21 --single-branch https://github.com/openshift/containerd.git openshift-containerd
        cd openshift-containerd/
        make containerd
      from: src
      resources:
        requests:
          cpu: 100m
zz_generated_metadata:
  branch: release-4.21
  org: openshift
  repo: containerd
